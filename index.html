<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凱基智富管家 — 對話流程原型</title>
<!-- One KGI Design Guideline tokens（原始檔案見 /One KGI Design Guideline，此處為專案內可直接引用的副本） -->
<link rel="stylesheet" href="css/tokens/colors.css">
<link rel="stylesheet" href="css/tokens/radius-tokens.css">
<link rel="stylesheet" href="css/tokens/shadow.css">
<link rel="stylesheet" href="css/tokens/spacing.css">
<link rel="stylesheet" href="css/tokens/kgi-typography-tokens.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/component-library.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="app-header-brand" role="img" aria-label="凱基銀行 AI 智富管家">
      <img class="app-header-logo-icon" src="assets/logo-icon.svg" alt="">
      <img class="app-header-logo-kgib" src="assets/logo-kgib-text.svg" alt="">
      <span class="app-header-logo-divider" aria-hidden="true"></span>
      <img class="app-header-logo-ai" src="assets/logo-ai-text.svg" alt="">
    </div>
    <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false" aria-label="靜音">
      <svg class="sound-toggle-icon sound-toggle-icon-on" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M18.5 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg class="sound-toggle-icon sound-toggle-icon-off" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button class="reset" onclick="resetAll()">↺ <span class="reset-label">重新開始</span></button>
  </header>
  <div class="screen" id="screen"></div>
  <div class="controls" id="controls"></div>
  <div id="inputbar" style="display:none"></div>
</div>
<!-- lottie-web：現金占比選項卡改用 Lottie 動畫圖示，見 js/flow.js CASH_RATIO_ICONS。
     直接把套件檔案存在 js/vendor/（原始版本：cdnjs bodymovin 5.12.2）而不是連外部 CDN——
     銀行內網對外部 CDN 網域的存取常受限制／被攔截，改自己 host 這個檔案就不會受影響。 -->
<script src="js/vendor/lottie.min.js"></script>
<!-- 現金占比選項卡的 Lottie 動畫資料本身用 <script> 標籤載入（把 JSON 包成一段
     `window.__LOTTIE_DATA['xxx']=` 賦值語法，而不是讓 js/flow.js 在執行期用
     fetch() 另外去抓 .json 檔）：這個專案是純靜態頁面，常會直接用瀏覽器開啟本機
     index.html（file:// 開頭的網址）預覽，而 fetch()／XMLHttpRequest 抓同一台機器
     上的本機檔案在 file:// 底下會被瀏覽器的 CORS 規則擋下來（這是瀏覽器本身的安全
     限制，不是伺服器或程式能繞過的），但一般 <script src="..."> 標籤載入本機檔案
     不受這個限制——這個專案其他 js/*.js 檔案本來就是這樣載入的。改用同一種方式載入
     動畫資料，不管是用本機伺服器開，還是直接雙擊 index.html 開，都能正常播放。 -->
<script src="assets/lottie/cash-95-plus.js"></script>
<script src="assets/lottie/cash-50-95.js"></script>
<script src="assets/lottie/cash-5-50.js"></script>
<script src="assets/lottie/cash-under-5.js"></script>
<script src="assets/lottie/feedback-confetti.js"></script>
<!-- 共用層：積木、狀態、連接流程、商品資料（三人共用，PR 需 review） -->
<script src="js/sound.js"></script>
<script src="js/shaping-orb.js"></script>
<script src="js/globe-loader.js"></script>
<script src="js/engine.js"></script>
<script src="js/component-library.js"></script>
<script src="js/catalog.js"></script>
<script src="js/flow.js"></script>
<!-- 內容層：各自負責一種使用者屬性的推薦內容，可獨立編輯、獨立提 PR -->
<script src="js/content-attr-a.js"></script> <!-- 負責人 A：屬性 A 成長潛力型（基金） -->
<script src="js/content-attr-b.js"></script> <!-- 負責人 B：屬性 B 穩健收息型（債券） -->
<script src="js/content-attr-c.js"></script> <!-- 負責人 C：屬性 C 保本安穩型（定存） -->
<!-- App 啟動（最後載入） -->
<script src="js/bootstrap.js"></script>
</body>
</html>
