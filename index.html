<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凱基智富管家 — 對話流程原型</title>
<!-- One KGI Design Guideline tokens（原始檔案見 /One KGI Design Guideline，此處為專案內可直接引用的副本） -->
<link rel="stylesheet" href="css/tokens/colors.css">
<link rel="stylesheet" href="css/tokens/radius-tokens.css">
<link rel="stylesheet" href="css/tokens/shadow.css">
<link rel="stylesheet" href="css/tokens/spacing.css">
<link rel="stylesheet" href="css/tokens/kgi-typography-tokens.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/component-library.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="app-header-brand" role="img" aria-label="凱基銀行 AI 智富管家">
      <img class="app-header-logo-icon" src="assets/logo-icon.svg" alt="">
      <img class="app-header-logo-kgib" src="assets/logo-kgib-text.svg" alt="">
      <img class="app-header-logo-divider" src="assets/logo-divider.svg" alt="">
      <img class="app-header-logo-ai" src="assets/logo-ai-text.svg" alt="">
    </div>
    <button class="reset" onclick="resetAll()">↺ <span class="reset-label">重新開始</span></button>
  </header>
  <div class="screen" id="screen"></div>
  <div class="controls" id="controls"></div>
  <div id="inputbar" style="display:none"></div>
</div>
<!-- 共用層：積木、狀態、連接流程、商品資料（三人共用，PR 需 review） -->
<script src="js/shaping-orb.js"></script>
<script src="js/globe-loader.js"></script>
<script src="js/engine.js"></script>
<script src="js/component-library.js"></script>
<script src="js/catalog.js"></script>
<script src="js/flow.js"></script>
<!-- 內容層：各自負責一種使用者屬性的推薦內容，可獨立編輯、獨立提 PR -->
<script src="js/content-attr-a.js"></script> <!-- 負責人 A：屬性 A 成長潛力型（基金） -->
<script src="js/content-attr-b.js"></script> <!-- 負責人 B：屬性 B 穩健收息型（債券） -->
<script src="js/content-attr-c.js"></script> <!-- 負責人 C：屬性 C 保本安穩型（定存） -->
<!-- App 啟動（最後載入） -->
<script src="js/bootstrap.js"></script>
</body>
</html>
